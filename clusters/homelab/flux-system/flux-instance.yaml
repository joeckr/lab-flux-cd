apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.x"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    multitenant: false
    networkPolicy: true
  sync:
    kind: GitRepository
    url: https://forgejo.joeckr.dev/joeckr/lab-flux-cd.git
    ref: refs/heads/main
    path: clusters/homelab
    pullSecret: forgejo-auth
  kustomize:
    patches:
      # Artifact storage on Longhorn instead of emptyDir.
      - target:
          kind: Deployment
          name: source-controller
        patch: |
          - op: replace
            path: /spec/template/spec/volumes/0
            value:
              name: data
              persistentVolumeClaim:
                claimName: source-controller-data
