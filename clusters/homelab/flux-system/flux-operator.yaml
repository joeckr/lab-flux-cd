apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  ref:
    semver: ">=0.0.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: flux-operator
  values:
    web:
      config:
        baseURL: https://flux.joeckr.dev
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            issuerURL: https://REPLACE_ME.zitadel.cloud
            clientIDSecretRef:
              name: zitadel-oidc
              key: clientID
            clientSecretRef:
              name: zitadel-oidc
              key: clientSecret
