apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: flux
  namespace: flux-system
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      port: 8000 # Traefik "web" entrypoint; TLS terminates at Cloudflare
      protocol: HTTP
      hostname: flux.joeckr.dev
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
  namespace: flux-system
spec:
  parentRefs:
    - name: flux
  hostnames:
    - flux.joeckr.dev
  rules:
    - backendRefs:
        - name: flux-operator
          port: 9080
