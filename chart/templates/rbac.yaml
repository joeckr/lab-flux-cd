{{- range .Values.rbac.oidcBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .name }}
  labels:
    {{- include "lab-flux-cd.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .clusterRoleName }}
subjects:
  {{- range .subjects }}
  - apiGroup: rbac.authorization.k8s.io
    kind: {{ .kind }}
    name: {{ .name | quote }}
  {{- end }}
{{- end }}
