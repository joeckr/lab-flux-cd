{{- if and .Values.oidc.enabled (not .Values.oidc.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.oidc.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab-flux-cd.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    apiVersion: web.fluxcd.controlplane.io/v1
    kind: Config
    spec:
      baseURL: {{ .Values.oidc.baseURL }}
      authentication:
        type: OAuth2
        oauth2:
          provider: OIDC
          issuerURL: {{ .Values.oidc.issuerURL }}
          clientID: {{ .Values.oidc.clientID | quote }}
          clientSecret: {{ .Values.oidc.clientSecret | quote }}
          impersonation:
            username: {{ .Values.oidc.impersonation.username | quote }}
            groups: {{ .Values.oidc.impersonation.groups | quote }}
{{- end }}
{{- if and .Values.fluxInstance.enabled .Values.fluxInstance.sync.enabled (not .Values.fluxInstance.sync.existingSecret) .Values.fluxInstance.sync.username }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fluxInstance.sync.pullSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab-flux-cd.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.fluxInstance.sync.username | quote }}
  password: {{ .Values.fluxInstance.sync.password | quote }}
{{- end }}
