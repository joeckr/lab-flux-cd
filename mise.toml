[tools]
betterleaks = "latest"
"go:github.com/google/addlicense" = "v1.2.0"
trivy = "v0.74.0"
helm = "v3.14.0"
actionlint = "v1.7.1"
shellcheck = "latest"
zizmor = "latest"
hk = "latest"
pkl = "latest"
tombi = "latest"
yamllint = "latest"

[tasks.install]
description = "Install tools, hook up hooks, and prepare environment"
run = """
hk install --mise
"""

[tasks.hk]
description = "Run hk checks on all files"
alias = "check"
run = """
hk check --all
"""

[tasks.helm-d]
description = "Build Helm chart dependencies"
run = """
helm dependency build chart/
"""

[tasks.helm-up]
description = "Update Helm chart dependencies and Chart.lock"
run = """
helm dependency update chart/
"""

[tasks.helm-l]
description = "Lint Helm chart"
depends = ["helm-d"]
run = """
helm lint chart/
"""

[tasks.helm-t]
description = "Render Helm chart templates to rendered.yaml"
depends = ["helm-d"]
run = """
helm template flux chart/ --namespace flux-system > rendered.yaml
"""

[tasks.helm-i]
description = "Install or upgrade Flux CD Helm chart (pass OIDC values via -f values.local.yaml or --set)"
depends = ["helm-d"]
run = """
if ! kubectl get crd fluxinstances.fluxcd.controlplane.io >/dev/null 2>&1; then
  helm upgrade --install flux chart/ --namespace flux-system --set fluxInstance.enabled=false "$@"
  kubectl wait --for=condition=Established crd/fluxinstances.fluxcd.controlplane.io --timeout=60s
fi
helm upgrade --install flux chart/ --namespace flux-system --reset-values "$@"
"""

[tasks.helm-u]
description = "Uninstall Flux CD Helm chart from flux-system"
run = """
helm uninstall flux --namespace flux-system
"""

[tasks.ui]
description = "Port-forward Flux Operator Web UI to http://localhost:9080"
run = """
kubectl -n flux-system port-forward svc/flux-operator 9080:9080
"""

[tasks.trivy-fs]
description = "Run Trivy on the file system"
run = """
trivy fs .
"""
